[workspace]
members = ["crates/core", "crates/macros", "crates/engine", "crates/ui", "crates/ui-term", "crates/app", "crates/rml", "crates/lsp", "demo"]
# dap 暂移出 workspace：其 lldb 重型 git 依赖在受限网络下阻塞编译。
# 需要时 cd 进对应目录单独构建，或重新加入 members。
exclude = ["crates/dap"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# GPUI 来自 Zed 官方仓库，锁定到与 gpui-component 兼容的 rev
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
# 外部组件库
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", features = ["tree-sitter-languages"] }
# gpui-component 内置资源（SVG 图标，包括窗口 min/max/restore/close）
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git" }

# 内部 crate
rust-rml-core = { path = "crates/core" }
rust-rml-macros = { path = "crates/macros" }
rust-rml-engine = { path = "crates/engine" }
rust-rml-ui = { path = "crates/ui" }
rust-rml-ui-term = { path = "crates/ui-term" }
rust-rml-app = { path = "crates/app" }
rust-rml-lsp = { path = "crates/lsp" }
rust-rml-dap = { path = "crates/dap" }
rust-rml-client = { path = "crates/rml", package = "rust-rml-client" }

# 客户端共用依赖（rust-rml-client 与 demo 共用）
tree-sitter = "0.26"
tree-sitter-language = "0.1"
lsp-types = "0.97"
lsp-server = "0.7"
crossbeam-channel = "0.5"
url = "2"
ropey = "=2.0.0-beta.1"
anyhow = "1"
serde_json = "1"
log = "0.4"

# 过程宏依赖
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
