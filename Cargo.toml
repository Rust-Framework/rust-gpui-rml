[workspace]
members = ["crates/core", "crates/macros", "crates/engine", "crates/ui", "crates/app", "demo", "crates/lsp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# GPUI 来自 Zed 官方仓库，锁定到与 gpui-component 兼容的 rev
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
# 外部组件库
gpui-component = { git = "https://github.com/longbridge/gpui-component.git" }
# gpui-component 内置资源（SVG 图标，包括窗口 min/max/restore/close）
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git" }

# 内部 crate
rust-rml-core = { path = "crates/core" }
rust-rml-macros = { path = "crates/macros" }
rust-rml-engine = { path = "crates/engine" }
rust-rml-ui = { path = "crates/ui" }
rust-rml-app = { path = "crates/app" }
rust-rml-lsp = { path = "crates/lsp" }

# 过程宏依赖
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
