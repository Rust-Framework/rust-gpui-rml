[workspace]
members = ["crates/core", "crates/macros", "crates/rml", "crates/app", "demo"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# GPUI 来自 Zed 官方仓库（建议后续锁定到具体 rev 以保证稳定性）
gpui = { git = "https://github.com/zed-industries/zed.git" }
# 外部组件库
gpui-component = { git = "https://github.com/longbridge/gpui-component.git" }

# 内部 crate
rml-core = { path = "crates/core" }
rml-macros = { path = "crates/macros" }
rml = { path = "crates/rml" }
rml-app = { path = "crates/app" }

# 过程宏依赖
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
