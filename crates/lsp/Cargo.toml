[package]
name = "rust-rml-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RML 语言服务器（LSP）——补全/诊断/悬停"

[lib]
name = "rml_lsp"
path = "src/lib.rs"

[[bin]]
name = "rml-lsp"
path = "src/main.rs"

[dependencies]
rust-rml-engine = { workspace = true }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
