gpui = { workspace = true }
gpui-component = { workspace = true }
tree-sitter-rml = { workspace = true }
tree-sitter = "0.26"
flume = "0.12"
lsp-server = "0.7"
lsp-types = "0.97"
url = "2"
ropey = "=2.0.0-beta.1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[build-dependencies]
rust-rml-engine = { workspace = true }
